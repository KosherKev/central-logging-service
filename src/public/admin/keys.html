<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>central-logging-service — API keys</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 900px;
    margin: 2rem auto;
    padding: 0 1rem;
    color: #1a1a1a;
    background: #fafafa;
  }
  h1 { font-size: 1.4rem; }
  .muted { color: #666; font-size: 0.85rem; }
  section { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 1.25rem; margin-bottom: 1.5rem; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #eee; }
  th { color: #555; font-weight: 600; }
  .scopes span, .envs span {
    display: inline-block; background: #eef; border-radius: 4px; padding: 0.1rem 0.4rem;
    margin-right: 0.25rem; font-size: 0.75rem; color: #334;
  }
  .revoked { color: #999; text-decoration: line-through; }
  label { display: block; margin-bottom: 0.6rem; font-size: 0.9rem; }
  input[type=text], select { width: 100%; padding: 0.4rem; box-sizing: border-box; margin-top: 0.2rem; }
  .scope-checks label { display: inline-block; width: auto; margin-right: 1rem; font-weight: normal; }
  button {
    padding: 0.5rem 0.9rem; border: 1px solid #333; border-radius: 6px; background: #1a1a1a;
    color: #fff; cursor: pointer; font-size: 0.85rem;
  }
  button.secondary { background: #fff; color: #1a1a1a; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .row-actions button { margin-right: 0.3rem; padding: 0.25rem 0.5rem; font-size: 0.75rem; }
  .raw-key-box {
    background: #fff8dc; border: 1px solid #e0c26a; border-radius: 6px; padding: 0.75rem;
    font-family: monospace; word-break: break-all; margin-top: 0.75rem;
  }
  .error { color: #b00020; font-size: 0.85rem; }
  #unlock-panel input { width: 320px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <h1>central-logging-service — API keys</h1>
  <p class="muted">
    One key type for logs and metrics, scoped per app. Raw keys are shown exactly once —
    copy them immediately, they are never stored in plaintext and never shown again.
  </p>

  <section id="unlock-panel">
    <label>Admin token
      <input type="text" id="admin-token-input" placeholder="paste ADMIN_SETUP_TOKEN" />
    </label>
    <button id="unlock-btn">Unlock</button>
    <p class="error" id="unlock-error" hidden></p>
  </section>

  <section id="app-panel" hidden>
    <h2 style="font-size:1.1rem;margin-top:0">Create a key</h2>
    <form id="create-form">
      <label>App ID
        <input type="text" name="appId" required placeholder="e.g. academicx" />
      </label>
      <label>Label (optional)
        <input type="text" name="label" placeholder="e.g. AcademicX producer" />
      </label>
      <div class="scope-checks">
        <span class="muted">Scopes:</span><br />
        <label><input type="checkbox" name="scope" value="logs:read" /> logs:read</label>
        <label><input type="checkbox" name="scope" value="logs:write" /> logs:write</label>
        <label><input type="checkbox" name="scope" value="metrics:read" /> metrics:read</label>
        <label><input type="checkbox" name="scope" value="metrics:write" /> metrics:write</label>
      </div>
      <label style="max-width:200px">Environment
        <select name="environment">
          <option value="live">live</option>
          <option value="test">test</option>
          <option value="both">both</option>
        </select>
      </label>
      <button type="submit">Create key</button>
      <p class="error" id="create-error" hidden></p>
    </form>
    <div id="raw-key-result" hidden></div>
  </section>

  <section id="list-panel" hidden>
    <h2 style="font-size:1.1rem;margin-top:0">Existing keys</h2>
    <table>
      <thead>
        <tr>
          <th>App ID</th><th>Label</th><th>Scopes</th><th>Env</th>
          <th>Last used</th><th>Created</th><th></th>
        </tr>
      </thead>
      <tbody id="keys-tbody"></tbody>
    </table>
  </section>

<script>
(function () {
  var tokenKey = 'cls_admin_token';
  var token = null;

  function el(tag, opts) {
    var e = document.createElement(tag);
    opts = opts || {};
    if (opts.text !== undefined) e.textContent = opts.text;
    if (opts.className) e.className = opts.className;
    return e;
  }

  function authHeaders() {
    return { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' };
  }

  async function api(path, options) {
    var res = await fetch(path, Object.assign({}, options, {
      headers: Object.assign({}, authHeaders(), (options && options.headers) || {})
    }));
    var body = await res.json().catch(function () { return {}; });
    if (!res.ok) {
      throw new Error(body.error || ('Request failed: HTTP ' + res.status));
    }
    return body;
  }

  function renderKeys(rows) {
    var tbody = document.getElementById('keys-tbody');
    tbody.innerHTML = '';
    rows.forEach(function (row) {
      var tr = el('tr');
      if (row.revoked) tr.className = 'revoked';

      var appIdTd = el('td', { text: row.appId });
      var labelTd = el('td', { text: row.label || '—' });

      var scopesTd = el('td', { className: 'scopes' });
      (row.scopes || []).forEach(function (s) {
        scopesTd.appendChild(el('span', { text: s }));
      });

      var envsTd = el('td', { className: 'envs' });
      (row.environments || []).forEach(function (e) {
        envsTd.appendChild(el('span', { text: e }));
      });

      var lastUsedTd = el('td', { text: row.lastUsedAt ? new Date(row.lastUsedAt).toLocaleString() : 'never' });
      var createdTd = el('td', { text: row.createdAt ? new Date(row.createdAt).toLocaleDateString() : '—' });

      var actionsTd = el('td', { className: 'row-actions' });
      if (!row.revoked) {
        (row.environments || []).forEach(function (envName) {
          var rotateBtn = el('button', { text: 'Rotate ' + envName, className: 'secondary' });
          rotateBtn.addEventListener('click', function () { rotate(row.appId, envName); });
          actionsTd.appendChild(rotateBtn);
        });
        var revokeBtn = el('button', { text: 'Revoke', className: 'secondary' });
        revokeBtn.addEventListener('click', function () { revoke(row.appId); });
        actionsTd.appendChild(revokeBtn);
      }

      [appIdTd, labelTd, scopesTd, envsTd, lastUsedTd, createdTd, actionsTd].forEach(function (td) {
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
  }

  async function loadKeys() {
    var result = await api('/admin/keys');
    renderKeys(result.data || []);
  }

  async function revoke(appId) {
    if (!window.confirm('Revoke the key(s) for "' + appId + '"? This takes effect immediately.')) return;
    await api('/admin/keys/' + encodeURIComponent(appId) + '/revoke', { method: 'POST' });
    await loadKeys();
  }

  async function rotate(appId, environment) {
    if (!window.confirm('Rotate the ' + environment + ' key for "' + appId + '"? The old value stops working immediately.')) return;
    var result = await api('/admin/keys/' + encodeURIComponent(appId) + '/rotate', {
      method: 'POST',
      body: JSON.stringify({ environment: environment })
    });
    showRawKey({ live: environment === 'live' ? result.data.rawKey : undefined,
                 test: environment === 'test' ? result.data.rawKey : undefined });
    await loadKeys();
  }

  function showRawKey(rawKeys) {
    var box = document.getElementById('raw-key-result');
    box.innerHTML = '';
    box.hidden = false;
    var notice = el('p', { text: 'Copy now — this value will never be shown again.' });
    notice.className = 'error';
    box.appendChild(notice);
    ['test', 'live'].forEach(function (env) {
      if (rawKeys[env]) {
        var line = el('div', { className: 'raw-key-box', text: env + ': ' + rawKeys[env] });
        box.appendChild(line);
      }
    });
  }

  document.getElementById('create-form').addEventListener('submit', async function (ev) {
    ev.preventDefault();
    var form = ev.target;
    var errorEl = document.getElementById('create-error');
    errorEl.hidden = true;
    var scopes = Array.prototype.slice
      .call(form.querySelectorAll('input[name=scope]:checked'))
      .map(function (cb) { return cb.value; });

    try {
      var result = await api('/admin/keys', {
        method: 'POST',
        body: JSON.stringify({
          appId: form.appId.value.trim(),
          label: form.label.value.trim() || undefined,
          scopes: scopes,
          environment: form.environment.value
        })
      });
      showRawKey(result.data.rawKeys);
      form.reset();
      await loadKeys();
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.hidden = false;
    }
  });

  document.getElementById('unlock-btn').addEventListener('click', async function () {
    var input = document.getElementById('admin-token-input');
    var errorEl = document.getElementById('unlock-error');
    errorEl.hidden = true;
    token = input.value.trim();
    if (!token) return;

    try {
      await loadKeys();
      try { sessionStorage.setItem(tokenKey, token); } catch (e) { /* private window etc — non-fatal */ }
      document.getElementById('unlock-panel').hidden = true;
      document.getElementById('app-panel').hidden = false;
      document.getElementById('list-panel').hidden = false;
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.hidden = false;
      token = null;
    }
  });

  // Best-effort restore of a token already unlocked this tab session.
  try {
    var saved = sessionStorage.getItem(tokenKey);
    if (saved) {
      document.getElementById('admin-token-input').value = saved;
      document.getElementById('unlock-btn').click();
    }
  } catch (e) { /* ignore */ }
})();
</script>
</body>
</html>
